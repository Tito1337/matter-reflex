name: ESPHome firmware and extension example
on:
  workflow_dispatch:
  push:
    paths: ['components/**', 'firmware/**', 'examples/**', 'tools/check-esphome', 'dev', '.github/workflows/esphome.yml']
  pull_request:
    paths: ['components/**', 'firmware/**', 'examples/**', 'tools/check-esphome', 'dev', '.github/workflows/esphome.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      matrix:
        profile: [xiao-esp32c6-ota, xiao-esp32c6-existing-ota, extend-node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile and link with disposable credentials
        run: tools/check-esphome compile ${{ matrix.profile }}
