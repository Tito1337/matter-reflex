name: ESP32-C6 firmware
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Reflex execution mode to test on virtual Thread
        type: choice
        default: direct
        options: [direct, fallback, advanced, all]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make room for the Espressif toolchain on the hosted runner
        if: runner.environment == 'github-hosted'
        run: |
          available_kib=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')
          if (( available_kib < 36 * 1024 * 1024 )); then
            sudo rm -rf -- /usr/local/lib/android/sdk
          fi
      - name: Run selected firmware regression
        env:
          REFLEX_MODE: ${{ inputs.mode }}
        run: ./dev lab takeover --mode "$REFLEX_MODE"
