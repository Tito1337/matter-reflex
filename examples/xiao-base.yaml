packages:
  reflex: !include reflex.yaml

esphome:
  project:
    name: tito1337.matter_reflex
    version: "0.2.0"
  name: matter-reflex

esp32:
  board: seeed_xiao_esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

openthread:
  device_type: FTD

matter:
  product_id: 0x8000

debug:
  update_interval: 5min

sensor:
  - platform: debug
    min_free:
      name: Minimum free heap
      entity_category: diagnostic

text_sensor:
  - platform: debug
    reset_reason:
      name: Reset reason
      entity_category: diagnostic

output:
  - platform: gpio
    id: reflex_indicator
    pin:
      number: GPIO15
      inverted: true

matter_reflex:
  ready_peers:
    name: Subscribed peers
  required_peers:
    name: Required peers
  active:
    id: reflex_active
    internal: true
    on_press:
      - output.turn_on: reflex_indicator
    on_release:
      - output.turn_off: reflex_indicator
  on_rule_result:
    - logger.log:
        format: "Rule %08lx, source event %llu, status 0x%03x"
        args: [rule_id, event_number, status]
